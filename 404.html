<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="robots" content="noindex">
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
	<link rel="icon" type="image/png" href="/favicon.png" />
	<title>Страница не найдена — Артём Толстихин</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		body {
			background: #0d0d0d;
			color: #fff;
			font-family: Arial, Helvetica, sans-serif;
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			text-align: center;
		}

		.wrap {
			padding: 24px;
		}

		h1 {
			font-size: 72px;
			line-height: 1;
			margin-bottom: 16px;
		}

		p {
			font-size: 18px;
			color: #c3c3c3;
			margin-bottom: 32px;
		}

		a {
			display: inline-block;
			padding: 12px 24px;
			border-radius: 20px;
			background: linear-gradient(135deg, #cc3700 0%, #ff4400 100%);
			color: #fff;
			text-decoration: none;
			font-size: 18px;
		}

		a:hover {
			background: linear-gradient(97deg, #ff6b33 0%, #ff4400 45%, #ff6633 62%);
		}
	</style>
</head>

<body>
	<div class="wrap">
		<h1>404</h1>
		<p>Страница не найдена или была перемещена.</p>
		<a href="/index.html">На главную</a>
